[project]
name = "speech-workbench"
version = "1.0.0"
description = "Unified web workbench for the Bailian speech demos"
requires-python = ">=3.12"
dependencies = [
    "dashscope>=1.25.0",
    "fastapi>=0.137",
    "uvicorn[standard]>=0.49",
    "python-multipart>=0.0.20",
    "websockets>=12.0",
]

[project.optional-dependencies]
# Only needed when deploying to Vercel, where enrollment clips go to Blob.
# Latest release is 0.4.2; there is no 0.27.x — the series runs 0.2 -> 0.3 -> 0.4.
vercel = ["vercel-blob>=0.4.2"]

[tool.vercel]
# Vercel 要求 module:variable 格式，不是文件路径。
# 写成 "server/main.py:app" 会被拒绝：
#   "tool.vercel.entrypoint" ... but no matching module file was found.
# 对应的文件路径 server/main.py 仍是 vercel.json 里 functions 的 key。
entrypoint = "server.main:app"

[tool.setuptools.packages.find]
include = ["server*"]