[project]
name = "speech-workbench"
version = "1.0.0"
description = "Unified web workbench for the Bailian speech demos"
requires-python = ">=3.12"
dependencies = [
    "dashscope>=1.25.0",
    "fastapi>=0.137",
    "uvicorn[standard]>=0.49",
    "python-multipart>=0.0.20",
    "websockets>=12.0",
]

[project.optional-dependencies]
# Only needed when deploying to Vercel, where enrollment clips go to Blob.
vercel = ["vercel-blob>=0.27"]

[tool.vercel]
entrypoint = "server/main.py:app"

[tool.setuptools.packages.find]
include = ["server*"]