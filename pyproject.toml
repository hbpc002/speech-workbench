[project]
name = "speech-workbench"
version = "1.0.0"
description = "Unified web workbench for the Bailian speech demos"
requires-python = ">=3.12"
dependencies = [
    "dashscope>=1.25.0",
    "fastapi>=0.137",
    "uvicorn[standard]>=0.49",
    "python-multipart>=0.0.20",
    "websockets>=12.0",
    # server/llm.py talks to any OpenAI-compatible endpoint directly rather
    # than through a vendor SDK. Already present as a dashscope dependency, but
    # declared here because it is now imported by our own code.
    "requests>=2.32",
    # Vercel Blob 后端（声音复刻在 Vercel 上的唯一可用路径）。必须是主依赖，
    # 不能放 optional 里：Vercel 的 Python 构建器只装 [project.dependencies]，
    # 放 extra 的话一键部署出来的声音复刻 100% 报「vercel-blob is required」。
    #
    # 这是 Vercel 官方 SDK（pip install vercel），不是 PyPI 上那个同名的个人
    # 封装 vercel-blob。0.12 把 0.11 的 AsyncBlobClient /
    # BlobNoTokenProvidedError 换成了模块级 put_blob / BlobCredentialsError，
    # server/storage.py 用的是后者，所以下限必须是 0.12。上限是防止下一个
    # minor 再改 API 时，一次重新部署又静默把声音复刻弄坏。
    "vercel>=0.12,<0.13",
]

[project.optional-dependencies]
# Needed only to run the test suite.
dev = ["pytest>=8.0"]

[tool.vercel]
# Vercel 要求 module:variable 格式，不是文件路径。
# 写成 "server/main.py:app" 会被拒绝：
#   "tool.vercel.entrypoint" ... but no matching module file was found.
# 对应的文件路径 server/main.py 仍是 vercel.json 里 functions 的 key。
entrypoint = "server.main:app"

[tool.setuptools.packages.find]
include = ["server*"]